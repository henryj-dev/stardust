# Throwaway PostgreSQL for the local quickstart only: fixed password, no
# persistent volume. Do not use this outside a local kind cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
          env:
            - { name: POSTGRES_USER, value: stardust }
            - { name: POSTGRES_PASSWORD, value: stardust }
            - { name: POSTGRES_DB, value: stardust }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, stardust]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
