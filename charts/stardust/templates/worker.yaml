apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stardust.fullname" . }}-worker
  labels:
    {{- include "stardust.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "stardust.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stardust.selectorLabels" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- include "stardust.podCommon" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "stardust.image" (list . "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "stardust.configEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/stardust, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "stardust.fullname" . }}-config
        - name: tmp
          emptyDir: {}
