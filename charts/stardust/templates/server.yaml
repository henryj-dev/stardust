{{- $port := int (default 8080 .Values.config.server.port) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stardust.fullname" . }}-server
  labels:
    {{- include "stardust.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "stardust.selectorLabels" (list . "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stardust.selectorLabels" (list . "server") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- if and .Values.builds.enabled .Values.builds.logs }}
      {{- /* Reads build logs only: its own account, bound to a read-only Role in the builds namespace. */}}
      {{- include "stardust.podCommon" (list . (printf "%s-server" (include "stardust.fullname" .)) true) | nindent 6 }}
      {{- else }}
      {{- include "stardust.podCommon" (list . (include "stardust.serviceAccountName" .) false) | nindent 6 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "stardust.image" (list . "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "stardust.configEnv" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 6
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/stardust, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: {{ include "stardust.fullname" . }}-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stardust.fullname" . }}-server
  labels:
    {{- include "stardust.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "stardust.selectorLabels" (list . "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
