{{- if .Values.web.enabled }}
{{- $port := int (default 3000 .Values.web.port) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stardust.fullname" . }}-web
  labels:
    {{- include "stardust.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "stardust.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stardust.selectorLabels" (list . "web") | nindent 8 }}
    spec:
      {{- include "stardust.podCommon" (list . (include "stardust.serviceAccountName" .) false) | nindent 6 }}
      containers:
        - name: web
          image: {{ include "stardust.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: PORT
              value: {{ $port | quote }}
            - name: STARDUST_API_URL
              value: {{ printf "http://%s-server:%d" (include "stardust.fullname" .) (int (default 8080 .Values.config.server.port)) | quote }}
            {{- with .Values.config.server.publicUrl }}
            # Where people reach the dashboard. Without it the adapter assumes https and
            # refuses every form posted over plain http as cross-site.
            - name: ORIGIN
              value: {{ regexFind "^https?://[^/]+" . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $port }}
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stardust.fullname" . }}-web
  labels:
    {{- include "stardust.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "stardust.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
