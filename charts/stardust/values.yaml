# Images. The release workflow writes each component's digest; when a digest
# is set it is used instead of the tag, so a released chart pins its images.
image:
  registry: ghcr.io/henryj-dev
  pullPolicy: IfNotPresent
  server:
    repository: stardust-server
    tag: "" # defaults to the chart's appVersion
    digest: ""
  worker:
    repository: stardust-worker
    tag: ""
    digest: ""
  web:
    repository: stardust-web
    tag: ""
    digest: ""

imagePullSecrets: []

# Rendered verbatim as stardust.yaml. Secrets are references only
# ({ env: NAME } or { file: PATH }); a plain-text secret is rejected by the
# values schema and again by the server at start-up.
config:
  version: 1
  server:
    port: 8080
    publicUrl: https://stardust.example.com
  database:
    url: { env: DATABASE_URL }
  plugins: {}

# Extra environment for the server and worker, typically a Secret holding the
# values that stardust.yaml references with { env: NAME }.
extraEnvFrom: []
#  - secretRef:
#      name: stardust-secrets

# Existing Secret holding the PostgreSQL connection URL. Required.
database:
  existingSecret: ""
  key: url

server:
  replicas: 1
  resources: {}

worker:
  replicas: 1
  resources: {}

web:
  enabled: true
  replicas: 1
  port: 3000
  resources: {}

# Builds run as Kubernetes Jobs in this namespace. When enabled, the worker
# gets its own service account with a token and a Role limited to Jobs,
# pods and pod logs in that namespace.
builds:
  enabled: false
  namespace: stardust-builds
  createNamespace: false
  # Show build logs in the dashboard: the server gets its own service account
  # with a token and a read-only Role (pods and pod logs) in the builds
  # namespace. false keeps the server without a token; runs then show no log.
  logs: true

# Editing env and secrets in the dashboard. The server then writes to the
# deploy repository (config.plugins.gitops-git; its credentials must reach the
# server, e.g. through extraEnvFrom) and encrypts with SOPS
# (config.plugins.secrets-sops-age). Name the Secret holding the age identity:
# it is mounted read-only in the server alone, at /run/secrets/age/keys.txt —
# set secrets-sops-age.ageKeyFile to that path. Empty: editing env is off.
envEditing:
  ageKeySecret: ""
  ageKeySecretKey: keys.txt

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
