name: verify release

# Re-checks a published release the way a deployment would: the chart and
# every image pinned in it must carry the release workflow's signature.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to verify, without the leading v (for example 0.1.0)
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: verify ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log helm in
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Verify
        env:
          VERSION: ${{ inputs.version }}
        run: tools/verify-release.sh "$VERSION"
