name: release

# The same flow as changesets-based projects such as cloudflare/workers-sdk:
#
# 1. Pull requests carry changeset files (`pnpm changeset`).
# 2. On every push to main, the changesets action opens or updates a
#    "Version Packages" pull request that bumps the version and the changelog.
# 3. Merging that pull request is the release: the version is new, so the
#    images and the chart are built, signed and published, and the tag and
#    GitHub release are created last.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  changesets:
    name: version PR or release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the changesets
        run: node tools/check-changesets.ts
      - id: changesets
        name: Open or update the Version Packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: plan
        name: Decide whether this commit is a release
        if: steps.changesets.outputs.has-changesets == 'false'
        run: tools/release-plan.sh origin

  images:
    name: image (${{ matrix.target }})
    needs: changesets
    if: needs.changesets.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        target: [server, worker, web]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/stardust-${{ matrix.target }}
      VERSION: ${{ needs.changesets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && echo "$DIGEST" >"digests/${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}
          if-no-files-found: error

  chart:
    name: chart
    needs: [changesets, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.changesets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Stamp version and digests into the chart
        run: tools/prepare-chart.sh "$VERSION" digests
      - name: Check that every image is pinned
        run: |
          pinned="$(helm template t charts/stardust --set database.existingSecret=db | grep -c '@sha256:')"
          [ "$pinned" = "3" ] || { echo "expected 3 pinned images, found $pinned"; exit 1; }
      - id: push
        name: Push and sign the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package charts/stardust --destination dist
          out="$(helm push "dist/stardust-${VERSION}.tgz" "oci://${REGISTRY}/charts" 2>&1)"
          echo "$out"
          digest="$(sed -n 's/^Digest: \(sha256:[a-f0-9]*\)$/\1/p' <<<"$out")"
          [ -n "$digest" ] || { echo "helm push printed no digest"; exit 1; }
          cosign sign --yes "${REGISTRY}/charts/stardust@${digest}"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  publish:
    name: GitHub release
    needs: [changesets, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Checkout first: it cleans the workspace and would delete the digests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.changesets.outputs.version }}
          CHART_DIGEST: ${{ needs.chart.outputs.digest }}
        run: |
          {
            # The changelog section for this version, without its heading.
            awk -v v="## ${VERSION}" '$0 == v {on=1; next} on && /^## / {exit} on' charts/stardust/CHANGELOG.md
            echo
            echo "## Artifacts"
            echo
            echo "| Artifact | Digest |"
            echo "|---|---|"
            echo "| \`${REGISTRY}/charts/stardust:${VERSION}\` | \`${CHART_DIGEST}\` |"
            for c in server worker web; do
              echo "| \`${REGISTRY}/stardust-${c}:${VERSION}\` | \`$(cat "digests/$c")\` |"
            done
            echo
            echo "Verify with:"
            echo
            echo '```sh'
            echo "cosign verify ${REGISTRY}/charts/stardust@${CHART_DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main"
            echo '```'
          } >notes.md
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v${VERSION}" --notes-file notes.md
