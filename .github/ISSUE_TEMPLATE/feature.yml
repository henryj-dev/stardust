name: Feature request
description: Propose a change or a new plugin.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If it adds an integration, say whether it should be a plugin and what it needs from core.
