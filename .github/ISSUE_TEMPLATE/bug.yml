name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private vulnerability reporting instead — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest configuration and commands that show the problem. Remove secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: stardust version
      placeholder: v0.1.0, or a commit SHA
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Kubernetes distribution and version, Flux version, how stardust is installed.
